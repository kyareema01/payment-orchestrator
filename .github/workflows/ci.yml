name: Payment Orchestrator CI

# Trigger this workflow on every push to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install Dependencies (Monorepo)
      run: npm ci

    - name: Type Check & Compile Backend
      run: npm run build --workspace apps/backend
      
    - name: Type Check & Compile Frontend
      run: npm run build --workspace apps/frontend

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Build Database Container
      run: docker-compose build mysql